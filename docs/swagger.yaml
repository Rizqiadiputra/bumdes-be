  dto.TenantResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      end_periode:
        type: string
      id:
        type: string
      kios_location_id:
        type: string
      kios_name:
        type: string
      name:
        type: string
      phone:
        type: string
      price:
        type: integer
      rental_type:
        type: string
      start_payment:
        type: string
      status:
        type: string
      tenant_type_id:
        type: string
      type:
        type: string
      updated_at:
        type: string
