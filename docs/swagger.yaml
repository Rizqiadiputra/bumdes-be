  dto.TenantTypeResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      status:
        type: string
      type:
        type: string
      updated_at:
        type: string
    type: object
  dto.TicketPriceResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      price:
        type: integer
      status:
        type: string
      type_name:
        type: string
      updated_at:
        type: string
    type: object
  dto.TicketingResponse:
    properties:
      count:
        type: integer
      created_at:
        type: string
      date:
        type: string
      id:
        type: string
      payment_id:
        type: integer
      payment_method_name:
        type: string
      price:
        type: integer
      ticket_price_id:
        type: string
      type_name:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
      user_name:
        type: string
    type: object
  dto.UpdateAccountRequest:
    properties:
      email:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      password:
        minLength: 6
        type: string
      role_id:
        type: integer
    required:
    - email
    - name
    - role_id
    type: object
  dto.UpdateAttractionPriceRequest:
    properties:
      name:
        type: string
      price:
        minimum: 0
        type: integer
      status:
        type: string
    required:
    - name
    - price
    - status
    type: object
  dto.UpdateAttractionRequest:
    properties:
      attraction_price_id:
        type: string
      count:
        minimum: 1
        type: integer
      payment_id:
        type: integer
    required:
    - attraction_price_id
    - count
    - payment_id
    type: object
  dto.UpdateKiosLocationRequest:
    properties:
      kios:
        type: string
      price:
        minimum: 0
        type: integer
      size:
        type: string
      status:
        type: string
    required:
    - kios
    - price
    - size
    - status
    type: object
  dto.UpdateParkingPriceRequest:
    properties:
      name:
        type: string
      price:
        minimum: 0
        type: integer
      status:
        type: string
    required:
    - name
    - price
    - status
    type: object
  dto.UpdatePaymentMethodRequest:
    properties:
      method:
        type: string
      status:
        type: string
    required:
    - method
    - status
    type: object
  dto.UpdateRevenueCategoryRequest:
    properties:
      category_name:
        type: string
      source:
        type: string
      status:
        type: string
    required:
    - category_name
    - source
    - status
    type: object
  dto.UpdateRolePermissionsRequest:
    properties:
      permission_ids:
        items:
          type: integer
        type: array
    type: object
  dto.UpdateTenantRequest:
    properties:
      email:
        type: string
      end_periode:
        type: string
      kios_location_id:
        type: string
      name:
        type: string
      phone:
        type: string
      price:
        minimum: 0
        type: integer
      rental_type:
        type: string
      start_payment:
        type: string
      status:
        type: string
      tenant_type_id:
        type: string
    required:
    - kios_location_id
    - name
    - phone
    - price
