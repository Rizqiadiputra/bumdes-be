      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      role:
        $ref: '#/definitions/dto.RoleResponse'
      updated_at:
        type: string
    type: object
  utils.ErrorResponse:
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
  utils.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
      success:
        type: boolean
    type: object
info:
  contact: {}
  description: 'REST API untuk aplikasi BUMDes: autentikasi, profil user, manajemen
    role & permission, dan manajemen akun.'
  title: BUMDes Backend API
  version: "1.0"
paths:
  /accounts:
    get:
      description: Menampilkan daftar seluruh akun/user beserta role masing-masing.
        Bisa difilter dengan pencarian nama/email dan nama role.
      parameters:
      - description: Cari berdasarkan nama atau email
        in: query
        name: search
        type: string
      - description: Filter berdasarkan nama role, isi 'all' untuk semua role
        in: query
        name: name_role
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.UserResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List Akun
      tags:
      - Account Management
    post:
      consumes:
      - application/json
      description: Membuat akun/user baru
      parameters:
      - description: Data akun baru
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Buat Akun
      tags:
      - Account Management
  /accounts/{id}:
    delete:
      description: Menghapus akun/user
      parameters:
      - description: User ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Hapus Akun
      tags:
      - Account Management
    put:
      consumes:
      - application/json
      description: Mengubah data akun/user
      parameters:
      - description: User ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Data akun yang diubah
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Ubah Akun
      tags:
      - Account Management
  /attractions:
    get:
      description: Menampilkan daftar transaksi wahana. Default menampilkan transaksi
        hari ini, bisa difilter dengan date, attraction_name, dan payment_method (berdasarkan
        payment_method_name).
      parameters:
      - description: 'Filter tanggal, format YYYY-MM-DD (default: hari ini)'
        in: query
        name: date
        type: string
      - description: Filter berdasarkan nama wahana
        in: query
        name: attraction_name
        type: string
      - description: Filter berdasarkan payment_method_name
        in: query
        name: payment_method
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.AttractionResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List Transaksi Wahana
      tags:
      - Attraction
    post:
      consumes:
      - application/json
      description: Membuat transaksi wahana baru. Field attraction_name dan price
        otomatis diambil dari tarif wahana (attraction_price_id), payment_method_name
        otomatis diambil dari payment_id. user_id otomatis diisi dari user yang sedang
        login, date otomatis diisi tanggal hari ini.
      parameters:
      - description: Data transaksi wahana baru
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateAttractionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/utils.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AttractionResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Buat Transaksi Wahana
      tags:
      - Attraction
  /attractions/{id}:
    delete:
      description: Menghapus transaksi wahana
      parameters:
      - description: Attraction ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Hapus Transaksi Wahana
      tags:
      - Attraction
    get:
      description: Menampilkan detail satu transaksi wahana
      parameters:
      - description: Attraction ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AttractionResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Detail Transaksi Wahana
      tags:
      - Attraction
    put:
      consumes:
      - application/json
      description: Mengubah data transaksi wahana. Field attraction_name, price, dan
        payment_method_name otomatis dihitung ulang berdasarkan attraction_price_id/payment_id
        yang baru.
      parameters:
      - description: Attraction ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Data transaksi wahana yang diubah
        in: body
