      id:
        type: string
      location:
        type: string
      payment_method_id:
        type: integer
      payment_method_name:
        type: string
      price:
        type: integer
      status:
        type: string
      type:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
      user_name:
        type: string
    type: object
  dto.PaymentMethodResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      method:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  dto.PermissionResponse:
    properties:
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  dto.RevenueCategoryResponse:
    properties:
      category_name:
        type: string
      created_at:
        type: string
      id:
        type: integer
      source:
        type: string
      status:
        type: string
      updated_at:
        type: string
