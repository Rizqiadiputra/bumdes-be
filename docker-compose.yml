services:
  # migrate:
  #   build: .
  #   entrypoint: ["./migrate"]
  #   env_file:
  #     - .env
  #   extra_hosts:
  #     # "host-gateway" resolves to the default bridge's gateway (172.17.0.1), not this
  #     # project's `edge` network gateway, so on a container only attached to `edge` it's
  #     # unreachable (ENETUNREACH). Point it at `edge`'s actual gateway instead.
  #     - "host.docker.internal:172.18.0.1"
  #   networks:
  #     - edge

  bumdes_api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:172.18.0.1"
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - edge

  seed:
    build: .
    entrypoint: ["./seed"]
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:172.18.0.1"
    profiles:
      - tools
    networks:
      - edge

  billing-cron:
    build: .
    entrypoint: ["./billing-cron"]
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:172.18.0.1"
    profiles:
      - tools
    networks:
      - edge

networks:
  edge:
    external: true
