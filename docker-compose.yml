services:
  migrate:
    build: .
    entrypoint: ["./migrate"]
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
    networks:
      - edge

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - edge

  seed:
    build: .
    entrypoint: ["./seed"]
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
    profiles:
      - tools
    networks:
      - edge

  billing-cron:
    build: .
    entrypoint: ["./billing-cron"]
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal"
    profiles:
      - tools
    networks:
      - edge

networks:
  edge:
    external: true
